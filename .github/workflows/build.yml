name: Build and upload

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  itunes-rss:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: cdk/.nvmrc
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - run: npm ci
        name: Prepare for CDK infrastructure build
        working-directory: cdk
      - run: npm test
        name: Test CDK infrastructure integrity
        working-directory: cdk
      - run: npm run synth
        name: Build infrastructure definition from CDK
        working-directory: cdk

      - uses: guardian/setup-scala@v1

      - name: Build and test
        env:
          SBT_JUNIT_OUTPUT: ./junit-tests
          JAVA_OPTS: -Dsbt.log.noformat=true
        run: |
          sbt 'test;debian:packageBin'
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v1
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          files: junit-tests/*.xml

      - name: Upload deployable artifacts
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: riff-raff-artifacts
          path: |
            cdk/cdk.out/PodcastsRss-PROD.template.json
            cdk/cdk.out/PodcastsRss-CODE.template.json
            target/podcasts-rss_1.0_all.deb
          if-no-files-found: error
          retention-days: 1

  riff-raff:
    if: github.event_name != 'pull_request'
    needs: itunes-rss
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: riff-raff-artifacts
      - uses: guardian/actions-riff-raff@v4
        with:
          configPath: conf/riff-raff.yaml
          projectName: Off-platform::podcasts-rss
          buildNumberOffset: 374
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          contentDirectories: |
            cloudformation:
              - cdk/cdk.out/PodcastsRss-PROD.template.json
              - cdk/cdk.out/PodcastsRss-CODE.template.json
            podcasts-rss:
              - target/podcasts-rss_1.0_all.deb
